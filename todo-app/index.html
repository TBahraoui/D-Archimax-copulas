<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List App</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>
                <i class="fas fa-check-circle"></i>
                My Tasks
            </h1>
            <p class="subtitle">Stay organized and productive</p>
        </header>

        <div class="input-section">
            <form id="todoForm">
                <div class="input-wrapper">
                    <input
                        type="text"
                        id="todoInput"
                        placeholder="Add a new task..."
                        class="todo-input"
                        autocomplete="off"
                    />
                    <select id="prioritySelect" class="priority-select">
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                    </select>
                    <button type="submit" class="add-btn">
                        <i class="fas fa-plus"></i>
                        Add Task
                    </button>
                </div>
            </form>
        </div>

        <div class="filters-section">
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">
                    <i class="fas fa-list"></i>
                    All
                </button>
                <button class="filter-btn" data-filter="active">
                    <i class="fas fa-circle"></i>
                    Active
                </button>
                <button class="filter-btn" data-filter="completed">
                    <i class="fas fa-check-circle"></i>
                    Completed
                </button>
                <button class="filter-btn" data-filter="high-priority">
                    <i class="fas fa-exclamation-circle"></i>
                    High Priority
                </button>
            </div>
            <div class="sort-section">
                <select id="sortSelect" class="sort-select">
                    <option value="date-desc">Newest First</option>
                    <option value="date-asc">Oldest First</option>
                    <option value="priority">By Priority</option>
                    <option value="alphabetical">A to Z</option>
                </select>
            </div>
        </div>

        <div class="stats-section">
            <div class="stat">
                <span class="stat-label">Total Tasks:</span>
                <span class="stat-value" id="totalTasks">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Completed:</span>
                <span class="stat-value" id="completedCount">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Remaining:</span>
                <span class="stat-value" id="remainingCount">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Progress:</span>
                <span class="stat-value" id="progressPercent">0%</span>
            </div>
        </div>

        <div class="progress-bar-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <div class="todos-section">
            <ul id="todoList" class="todo-list">
                <!-- Todos will be inserted here -->
            </ul>
            <div id="emptyState" class="empty-state">
                <i class="fas fa-inbox"></i>
                <p>No tasks yet. Add one to get started!</p>
            </div>
        </div>

        <div class="action-buttons">
            <button id="clearCompleted" class="clear-btn" title="Clear all completed tasks">
                <i class="fas fa-trash"></i>
                Clear Completed
            </button>
            <button id="exportBtn" class="export-btn" title="Export tasks as JSON">
                <i class="fas fa-download"></i>
                Export
            </button>
            <button id="importBtn" class="import-btn" title="Import tasks from JSON">
                <i class="fas fa-upload"></i>
                Import
            </button>
            <input type="file" id="fileInput" accept=".json" style="display: none;" />
        </div>

        <footer>
            <p>
                Made with <i class="fas fa-heart"></i> | Local storage enabled
                <span id="storageInfo"></span>
            </p>
        </footer>
    </div>

    <!-- Modal for editing todo -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close" id="closeModal">&times;</span>
            <h2>Edit Task</h2>
            <form id="editForm">
                <input
                    type="text"
                    id="editInput"
                    placeholder="Edit your task..."
                    class="edit-input"
                />
                <select id="editPrioritySelect" class="priority-select">
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>
                <div class="modal-buttons">
                    <button type="submit" class="save-btn">
                        <i class="fas fa-save"></i>
                        Save
                    </button>
                    <button type="button" class="cancel-btn" id="cancelBtn">
                        <i class="fas fa-times"></i>
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="todo-app.js"></script>
</body>
</html>
